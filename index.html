<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>

    <body>
        <h1>BlackJack</h1>
        <p id="message-el">Want to play a round?</p>
        <p id="dealercards-el"></p>
        <p id="cards-el">Cards: </p>
        <p id="sum-el">Sum: </p>
        <button id="start-btn">START GAME</button>
        <button id="newcard-btn">NEW CARD</button>
        <button id="stay-btn">STAY</button>
        
        <div id="user-info">
            <p>User info</p>
            <input type="text" id="input-el" placeholder="Enter new name">
            <button id="save-btn">SAVE</button>
        </div>
        
        <p id="player-el">Player: $0</p>
        <ul id="gamerecord-el"></ul>
        <script src="index.js"></script>
    </body>
</html>
